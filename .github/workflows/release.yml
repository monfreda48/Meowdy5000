name: Auto Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Extract Version Info
        id: get_version
        working-directory: frontend/android
        run: |
          V_CODE=$(grep -shoE 'versionCode\s*=?\s*[0-9]+' app/build.gradle* app/version.properties 2>/dev/null | head -1 | grep -oE '[0-9]+' || true)
          V_NAME=$(grep -shoE 'versionName\s*=?\s*["'\''"][^"'\'']+["'\''"]' app/build.gradle* app/version.properties 2>/dev/null | head -1 | sed -E 's/.*["'\''"]([^"'\'']+)["'\''"]/\1/' || true)
          
          if [ -z "$V_CODE" ]; then V_CODE="23"; fi
          if [ -z "$V_NAME" ]; then V_NAME="1.0.23"; fi
          
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "tag=v$V_NAME" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Create Git Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }} (Build ${{ steps.get_version.outputs.version_code }})
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
