name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Capacitor
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Build Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meowdy5000-StatTracker-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          tag: "v1.0.0"
          name: "Meowdy 5000 Stat Tracker Latest APK"
          allowUpdates: true
          recreateRelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
