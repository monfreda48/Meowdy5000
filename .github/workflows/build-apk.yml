name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Build APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android Assets
        run: |
          cd frontend
          npx cap sync android

      - name: Build Android APK
        run: |
          cd frontend/android
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meowdy5000-StatTracker-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Extract Version Info
        id: get_version
        run: |
          # Base offset so the build code stays higher than your current phone build (Build 22)
          BASE_OFFSET=20
          V_CODE=$((BASE_OFFSET + GITHUB_RUN_NUMBER))
          V_NAME="1.0.${V_CODE}"
          
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "tag=v$V_NAME" >> $GITHUB_OUTPUT
          echo "Automated Version: $V_NAME (Build $V_CODE)"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          target_commitish: "main"
          name: Release ${{ steps.get_version.outputs.tag }} (Build ${{ steps.get_version.outputs.version_code }})
          body: "Latest automated Android APK build from main branch."
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
