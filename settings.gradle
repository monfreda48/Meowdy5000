// Root Gradle settings configuration for IDE Gradle extension
include ':app'
project(':app').projectDir = new File('./frontend/android/app')

include ':capacitor-android'
project(':capacitor-android').projectDir = new File('./frontend/node_modules/@capacitor/android/capacitor')

include ':capacitor-app'
project(':capacitor-app').projectDir = new File('./frontend/node_modules/@capacitor/app/android')

include ':capacitor-browser'
project(':capacitor-browser').projectDir = new File('./frontend/node_modules/@capacitor/browser/android')

include ':capacitor-clipboard'
project(':capacitor-clipboard').projectDir = new File('./frontend/node_modules/@capacitor/clipboard/android')

include ':capacitor-device'
project(':capacitor-device').projectDir = new File('./frontend/node_modules/@capacitor/device/android')

include ':capacitor-filesystem'
project(':capacitor-filesystem').projectDir = new File('./frontend/node_modules/@capacitor/filesystem/android')

include ':capacitor-haptics'
project(':capacitor-haptics').projectDir = new File('./frontend/node_modules/@capacitor/haptics/android')

include ':capacitor-network'
project(':capacitor-network').projectDir = new File('./frontend/node_modules/@capacitor/network/android')

include ':capacitor-screen-orientation'
project(':capacitor-screen-orientation').projectDir = new File('./frontend/node_modules/@capacitor/screen-orientation/android')

include ':capacitor-share'
project(':capacitor-share').projectDir = new File('./frontend/node_modules/@capacitor/share/android')

include ':capacitor-splash-screen'
project(':capacitor-splash-screen').projectDir = new File('./frontend/node_modules/@capacitor/splash-screen/android')

include ':capacitor-status-bar'
project(':capacitor-status-bar').projectDir = new File('./frontend/node_modules/@capacitor/status-bar/android')

include ':capacitor-toast'
project(':capacitor-toast').projectDir = new File('./frontend/node_modules/@capacitor/toast/android')

if (file('frontend/android/capacitor-cordova-android-plugins/build.gradle').exists()) {
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = new File('./frontend/android/capacitor-cordova-android-plugins')
}
