import java.nio.file.Files
import java.nio.file.StandardCopyOption

apply plugin: 'com.android.application'

android {
    namespace 'com.meowdy5000.stattracker'
    compileSdk 35

    defaultConfig {
        applicationId "com.meowdy5000.stattracker"
        minSdk 24
        targetSdk 35
        versionCode 20
        versionName "1.0.20"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        def variantName = variant.buildType.name
        def buildDirFile = layout.buildDirectory.get().asFile
        def projectDirFile = projectDir
        def rootDirFile = rootDir
        variant.assembleProvider.configure { assembleTask ->
            assembleTask.doLast {
                def apkSrcDir = new File(buildDirFile, "outputs/apk/${variantName}")
                def repoRoot = new File(projectDirFile, "../../../")
                def copyApk = { File srcDir, File destDir ->
                    if (srcDir.exists() && destDir.exists()) {
                        srcDir.listFiles({ dir, name -> name.endsWith(".apk") } as FilenameFilter)?.each { apk ->
                            Files.copy(
                                apk.toPath(),
                                new File(destDir, apk.name).toPath(),
                                StandardCopyOption.REPLACE_EXISTING
                            )
                        }
                    }
                }
                if (new File(repoRoot, "package.json").exists()) {
                    copyApk(apkSrcDir, repoRoot)
                }
                copyApk(apkSrcDir, rootDirFile)
            }
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation project(':capacitor-android')
}

apply from: 'capacitor.build.gradle'
