apply plugin: 'com.android.application'

android {
    namespace 'com.meowdy5000.stattracker'
    compileSdk 35

    defaultConfig {
        applicationId "com.meowdy5000.stattracker"
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName "1.0.15"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.assembleProvider.get().doLast {
            def apkSrcDir = file("${layout.buildDirectory.get()}/outputs/apk/${variant.buildType.name}")
            copy {
                from apkSrcDir
                into file("${rootDir}/app/build/outputs/apk/${variant.buildType.name}")
                include "*.apk"
            }
            def repoRoot = file("${projectDir}/../../../")
            if (new File(repoRoot, "package.json").exists()) {
                copy {
                    from apkSrcDir
                    into repoRoot
                    include "*.apk"
                }
            }
            copy {
                from apkSrcDir
                into rootDir
                include "*.apk"
            }
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation project(':capacitor-android')
}

apply from: 'capacitor.build.gradle'
