<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>
  <!-- Black Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGradient)" stroke="#10b981" stroke-width="16" />
  <!-- Glowing Green M -->
  <path d="M 140 370 L 140 142 L 256 290 L 372 142 L 372 370" fill="none" stroke="#10b981" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>