<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Intense Multi-Stage Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feGaussianBlur stdDeviation="4" result="blur3" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050a06" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>

  <!-- Outer Neon Glow Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#00ff88" stroke-width="24" filter="url(#neonGlow)" opacity="0.8" />

  <!-- Solid Black Circle Base -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGradient)" stroke="#00ff88" stroke-width="18" />

  <!-- High-Voltage Neon Green Text Glow Layer -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#00ff88" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="220" letter-spacing="-12" filter="url(#neonGlow)">M5</text>

  <!-- Sharp White-Hot Center Text Layer -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="220" letter-spacing="-12" opacity="0.95">M5</text>
</svg>