<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b101e" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGradient)" stroke="#10b981" stroke-width="16" />

  <!-- 3D Emerald Wireframe Grid Mesh -->
  <g stroke="#34d399" stroke-width="6" fill="none" opacity="0.65">
    <!-- Latitude Lines -->
    <ellipse cx="256" cy="120" rx="200" ry="40" />
    <ellipse cx="256" cy="180" rx="226" ry="50" />
    <ellipse cx="256" cy="256" rx="236" ry="60" />
    <ellipse cx="256" cy="332" rx="226" ry="50" />
    <ellipse cx="256" cy="392" rx="200" ry="40" />
    <!-- Longitude Lines -->
    <ellipse cx="256" cy="256" rx="60" ry="236" />
    <ellipse cx="256" cy="256" rx="140" ry="236" />
    <ellipse cx="256" cy="256" rx="200" ry="236" />
  </g>

  <!-- Glowing Emerald M5 Text -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#34d399" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="220" letter-spacing="-12" filter="url(#emeraldGlow)">M5</text>
</svg>