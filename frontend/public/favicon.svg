<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>
  <!-- Black Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGradient)" stroke="#10b981" stroke-width="16" />
  <!-- Glowing Green M5 Text -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#34d399" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="220" letter-spacing="-12" filter="url(#glow)">M5</text>
</svg>